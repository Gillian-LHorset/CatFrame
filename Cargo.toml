[package]
name = "CatFrame"
version = "1.0.0"
description = "A tiny terminal application that plays ASCII-art cat animations, frame by frame, centered in your terminal. The animation come from Mistral Vibe."
repository = "https://github.com/Gillian-LHorset/CatFrame"
license = "MIT"
readme = "README.md"
edition = "2024"

[[bin]]
name = "lechat"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clearscreen = "5.0.0"
